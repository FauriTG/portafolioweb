<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensaje Enviado | Fauricio Quirós</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
    <style>
        :root {
            --bg-primary: #0a0e27;
            --text-primary: #e0e7ff;
            --accent-cyan: #00d9ff;
            --accent-purple: #a855f7;
            --glow-cyan: rgba(0, 217, 255, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        /* Partículas de fondo */
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, var(--accent-cyan) 1px, transparent 1px),
                        radial-gradient(circle, var(--accent-purple) 1px, transparent 1px);
            background-size: 50px 50px, 80px 80px;
            background-position: 0 0, 40px 40px;
            opacity: 0.1;
            animation: float-bg 20s linear infinite;
        }

        @keyframes float-bg {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .container {
            max-width: 600px;
            text-align: center;
            background: rgba(26, 31, 58, 0.8);
            backdrop-filter: blur(20px);
            padding: 4rem 3rem;
            border-radius: 30px;
            border: 2px solid var(--accent-cyan);
            box-shadow: 0 20px 80px rgba(0, 217, 255, 0.3);
            position: relative;
            z-index: 1;
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from { 
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-icon {
            font-size: 5rem;
            margin-bottom: 1.5rem;
            animation: bounce 1s ease infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        h1 {
            font-size: clamp(2rem, 5vw, 2.5rem);
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            font-weight: 800;
        }

        p {
            font-size: 1.2rem;
            color: #94a3b8;
            line-height: 1.8;
            margin-bottom: 2.5rem;
        }

        .back-button {
            display: inline-block;
            padding: 1rem 3rem;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 40px rgba(0, 217, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .back-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .back-button:hover::before {
            width: 300px;
            height: 300px;
        }

        .back-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 60px rgba(168, 85, 247, 0.5);
        }

        .back-button span {
            position: relative;
            z-index: 1;
        }

        @media (max-width: 768px) {
            .container {
                padding: 3rem 2rem;
            }

            .success-icon {
                font-size: 4rem;
            }

            p {
                font-size: 1.1rem;
            }

            .back-button {
                padding: 0.9rem 2.5rem;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">✅</div>
        <h1>¡Mensaje enviado con éxito!</h1>
        <p>Gracias por contactarme. Te responderé lo antes posible.</p>
        <a href="index.html" class="back-button">
            <span>← Volver al inicio</span>
        </a>
    </div>
</body>
</html>
